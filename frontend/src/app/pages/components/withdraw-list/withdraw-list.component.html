<table mat-table [dataSource]="withdrawForms" class="mat-elevation-z8 withdraw-table">
  <ng-container matColumnDef="order-no">
    <th mat-header-cell *matHeaderCellDef> Order No. </th>
    <td mat-cell *matCellDef="let element"> {{element.orderNo}} </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let element"> {{element.status}} </td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef> Amount </th>
    <td mat-cell *matCellDef="let element"> {{element.amount | number:'1.3-3'}} </td>
  </ng-container>

  <ng-container matColumnDef="created">
    <th mat-header-cell *matHeaderCellDef> Created On </th>
    <td mat-cell *matCellDef="let element"> {{element.createdOn | date:'yyyy-MM-dd HH:mm:ss'}} </td>
  </ng-container>

  <ng-container matColumnDef="updated">
    <th mat-header-cell *matHeaderCellDef> Updated On </th>
    <td mat-cell *matCellDef="let element"> {{element.updatedOn | date:'yyyy-MM-dd HH:mm:ss'}} </td>
  </ng-container>

  <ng-container matColumnDef="commands">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let element">
      <button mat-raised-button color="primary" *ngIf="element.status == 'Paid'"
        (click)="clickFixPaid(element);$event.stopPropagation()">FixPaid</button>
      <button mat-raised-button color="primary" *ngIf="element.status == 'Reject'"
        (click)="clickFixReject(element);$event.stopPropagation()">FixReject</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="withdrawDisplayColumns"></tr>
  <tr mat-row (click)="clickRow(row)" [class.app-row-is-selected]="selectedRowIds.has(row.id)"
    *matRowDef="let row; columns: withdrawDisplayColumns;"></tr>
</table>
