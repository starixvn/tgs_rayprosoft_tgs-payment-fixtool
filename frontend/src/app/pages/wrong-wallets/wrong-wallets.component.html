<table mat-table [dataSource]="wrongWallets" class="mat-elevation-z8 wrong-wallets-table">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef> UserName </th>
    <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
  </ng-container>

  <ng-container matColumnDef="balance">
    <th mat-header-cell *matHeaderCellDef> Balance </th>
    <td mat-cell *matCellDef="let element"> {{element.balance | number:'1.3-3'}} </td>
  </ng-container>

  <ng-container matColumnDef="locked-balance">
    <th mat-header-cell *matHeaderCellDef> Locked Balance </th>
    <td mat-cell *matCellDef="let element"> {{element.lockedBalance | number:'1.3-3'}} </td>
  </ng-container>

  <ng-container matColumnDef="in-progress">
    <th mat-header-cell *matHeaderCellDef> In Progress </th>
    <td mat-cell *matCellDef="let element"> {{element.inProgressAmount | number:'1.3-3'}} </td>
  </ng-container>

  <ng-container matColumnDef="commands">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let element">
      <button mat-raised-button color="primary"
        (click)="clickDetail(element.id)">Detail</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
</table>
